# billing range to export (inclusive) — YYYY-MM, YYYY-MM
billingRange:2026-05,2026-07

# generate PDF files
creatPdf:true

# open export folder after generating bills
openBillingFolder:true

# zip database/ to exports/backups/ before generating bills
backupBeforeBilling:true

# keep terminal open after scripts finish (set false when running from an IDE terminal that stays open)
pause_on_exit:true
